<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background-color: #0b111e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="primaryCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2638"/>
      <stop offset="100%" stop-color="#141e2e"/>
    </linearGradient>
    <linearGradient id="accentCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="680" fill="url(#bgGrad)"/>

  <!-- Title & Header -->
  <text x="40" y="44" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">KINESIS LOGGER — SYSTEM ARCHITECTURE</text>
  <text x="40" y="66" fill="#94a3b8" font-size="12">Native Android Data Acquisition Engine • Single Time-Base Sensor Streaming Pipeline</text>

  <rect x="750" y="26" width="210" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="766" cy="42" r="5" fill="#10b981"/>
  <text x="778" y="46" fill="#cbd5e1" font-size="11" font-weight="600">v0.1 Implemented &amp; Tested</text>

  <!-- SECTION 1: PROTOCOL DEFINITION & UI -->
  <rect x="40" y="90" width="270" height="255" rx="10" fill="url(#primaryCardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="40" y="90" width="270" height="30" rx="10" fill="#1e293b"/>
  <text x="56" y="110" fill="#38bdf8" font-size="12" font-weight="700">1. INPUT &amp; PRESENTATION LAYER</text>

  <!-- tasks.json node -->
  <rect x="56" y="132" width="238" height="42" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="68" y="152" fill="#e2e8f0" font-size="12" font-weight="600">assets/tasks.json</text>
  <text x="68" y="166" fill="#94a3b8" font-size="10">Immutable 16-task protocol definition</text>

  <!-- Jetpack Compose UI node -->
  <rect x="56" y="186" width="238" height="88" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="68" y="206" fill="#e2e8f0" font-size="12" font-weight="600">Jetpack Compose UI (M3)</text>
  <text x="78" y="224" fill="#cbd5e1" font-size="10">• Dashboard &amp; Subject Selector (S01–S06)</text>
  <text x="78" y="240" fill="#cbd5e1" font-size="10">• Pre-Flight Diagnostics (100 Hz / GPS audit)</text>
  <text x="78" y="256" fill="#cbd5e1" font-size="10">• Recording HUD &amp; Quality Summary</text>

  <rect x="56" y="286" width="238" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="68" y="304" fill="#e2e8f0" font-size="11" font-weight="600">Session Lifecycle Control</text>
  <text x="68" y="318" fill="#94a3b8" font-size="10">10s prep → 5s still → Bout → 5s still</text>

  <!-- SECTION 2: FOREGROUND EXECUTION & SENSORS -->
  <rect x="340" y="90" width="310" height="255" rx="10" fill="url(#primaryCardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="340" y="90" width="310" height="30" rx="10" fill="#1e293b"/>
  <text x="356" y="110" fill="#38bdf8" font-size="12" font-weight="700">2. SERVICE &amp; SENSOR ACQUISITION</text>

  <!-- Foreground Service -->
  <rect x="356" y="132" width="278" height="42" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
  <text x="368" y="152" fill="#93c5fd" font-size="12" font-weight="600">RecordingService (Foreground)</text>
  <text x="368" y="166" fill="#94a3b8" font-size="10">location|health • Partial Wake Lock • Sticky</text>

  <!-- Sensor Grid -->
  <rect x="356" y="186" width="132" height="40" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="366" y="202" fill="#e2e8f0" font-size="10" font-weight="600">IMU Sensors (100 Hz)</text>
  <text x="366" y="216" fill="#38bdf8" font-size="9">Accel &amp; Gyroscope</text>

  <rect x="502" y="186" width="132" height="40" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="512" y="202" fill="#e2e8f0" font-size="10" font-weight="600">Pedometer Engine</text>
  <text x="512" y="216" fill="#f59e0b" font-size="9">Detector &amp; Cumulative</text>

  <rect x="356" y="234" width="278" height="44" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="368" y="252" fill="#e2e8f0" font-size="11" font-weight="600">Dual Location Client (1 Hz)</text>
  <text x="368" y="266" fill="#94a3b8" font-size="9.5">FusedLocationProvider + GPS_PROVIDER • is_mock flag audit</text>

  <rect x="356" y="288" width="278" height="42" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="368" y="306" fill="#6ee7b7" font-size="11" font-weight="600">Hardware Monotonic Clock Sync</text>
  <text x="368" y="320" fill="#94a3b8" font-size="9.5">elapsedRealtimeNanos base • zero wall-clock per row</text>

  <!-- SECTION 3: QUEUE & IO PIPELINE -->
  <rect x="680" y="90" width="280" height="255" rx="10" fill="url(#primaryCardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="680" y="90" width="280" height="30" rx="10" fill="#1e293b"/>
  <text x="696" y="110" fill="#38bdf8" font-size="12" font-weight="700">3. ASYNCHRONOUS I/O &amp; WRITERS</text>

  <!-- Queues -->
  <rect x="696" y="132" width="248" height="42" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
  <text x="708" y="152" fill="#c7d2fe" font-size="12" font-weight="600">Thread-Safe Bounded Queues</text>
  <text x="708" y="166" fill="#94a3b8" font-size="10">ConcurrentLinkedQueue • Dropped sample accounting</text>

  <!-- Writer Worker -->
  <rect x="696" y="186" width="248" height="46" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="708" y="204" fill="#e2e8f0" font-size="11" font-weight="600">Dedicated Writer Daemon</text>
  <text x="708" y="220" fill="#94a3b8" font-size="9.5">Off-UI thread • Atomic flush &lt;= 1s • Crash-safe WAL</text>

  <!-- Target CSVs -->
  <rect x="696" y="242" width="248" height="88" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="708" y="260" fill="#e2e8f0" font-size="11" font-weight="600">Stream Outputs (Raw Gzip &amp; CSV):</text>
  <text x="716" y="278" fill="#38bdf8" font-size="9.5">• accel.csv.gz (100 Hz) &amp; gyro.csv.gz (100 Hz)</text>
  <text x="716" y="294" fill="#f59e0b" font-size="9.5">• step_detector.csv &amp; step_counter.csv</text>
  <text x="716" y="310" fill="#10b981" font-size="9.5">• location.csv (1 Hz Fused/GPS) &amp; events.csv</text>

  <!-- SECTION 4: STORAGE & INTEGRITY (Bottom Left) -->
  <rect x="40" y="375" width="440" height="265" rx="10" fill="url(#primaryCardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="40" y="375" width="440" height="30" rx="10" fill="#1e293b"/>
  <text x="56" y="395" fill="#38bdf8" font-size="12" font-weight="700">4. LOCAL STORAGE &amp; CRYPTOGRAPHIC INTEGRITY</text>

  <rect x="56" y="417" width="408" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="437" fill="#e2e8f0" font-size="11" font-weight="600">App-Specific Scoped Directory: Android/data/org.kinesis.logger/files/raw/</text>
  <text x="70" y="454" fill="#94a3b8" font-size="10">Session container: KIN-[YYYYMMDD]-[SubjectId]-[TaskId]-[UUID]</text>
  <text x="70" y="468" fill="#94a3b8" font-size="10">Self-contained directory holding raw gzipped sensor streams</text>

  <rect x="56" y="487" width="194" height="65" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="68" y="507" fill="#fde68a" font-size="11" font-weight="600">session.json Metadata</text>
  <text x="68" y="523" fill="#94a3b8" font-size="9.5">• Hardware specs &amp; boot_offset_ms</text>
  <text x="68" y="537" fill="#94a3b8" font-size="9.5">• QC rates, gaps, GPS audit, steps</text>

  <rect x="270" y="487" width="194" height="65" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
  <text x="282" y="507" fill="#a7f3d0" font-size="11" font-weight="600">manifest.sha256</text>
  <text x="282" y="523" fill="#94a3b8" font-size="9.5">• Cryptographic checksums</text>
  <text x="282" y="537" fill="#94a3b8" font-size="9.5">• Tamper-evident data freeze</text>

  <rect x="56" y="562" width="408" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="582" fill="#e2e8f0" font-size="11" font-weight="600">Session Quality Verification (Post-Session Screen)</text>
  <text x="70" y="598" fill="#94a3b8" font-size="10">• Achieved rate audit (&gt;= 95 Hz) • Dropped window audit (&lt; 0.5% gaps &gt; 100ms)</text>
  <text x="70" y="614" fill="#94a3b8" font-size="10">• GPS fix ratio (&gt;= 90% &lt;= 20m) • Ground truth vs OS step count comparison</text>

  <!-- SECTION 5: EXPORT & CLOUD PIPELINE (Bottom Right) -->
  <rect x="510" y="375" width="450" height="265" rx="10" fill="url(#primaryCardGrad)" stroke="#1e293b" stroke-width="1.5" filter="url(#subtleShadow)"/>
  <rect x="510" y="375" width="450" height="30" rx="10" fill="#1e293b"/>
  <text x="526" y="395" fill="#38bdf8" font-size="12" font-weight="700">5. EGRESS &amp; SECURE CLOUD SYNCHRONIZATION</text>

  <!-- Export path A: Local ZIP -->
  <rect x="526" y="417" width="200" height="90" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="538" y="437" fill="#e2e8f0" font-size="11" font-weight="600">Local Archive Export</text>
  <text x="538" y="455" fill="#94a3b8" font-size="10">• Android Share Sheet</text>
  <text x="538" y="471" fill="#94a3b8" font-size="10">• Session packaged to .zip</text>
  <text x="538" y="487" fill="#94a3b8" font-size="10">• ADB pull benchmark ready</text>

  <!-- Export path B: S3 Uploader -->
  <rect x="746" y="417" width="200" height="90" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1"/>
  <text x="758" y="437" fill="#7dd3fc" font-size="11" font-weight="600">AWS S3 Sync Queue</text>
  <text x="758" y="455" fill="#94a3b8" font-size="10">• Background WorkManager</text>
  <text x="758" y="471" fill="#94a3b8" font-size="10">• SHA-256 hash verified</text>
  <text x="758" y="487" fill="#94a3b8" font-size="10">• WiFi-only / Auto-retry</text>

  <!-- Cloud Ingestion Flow -->
  <rect x="526" y="520" width="420" height="106" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="540" y="542" fill="#6ee7b7" font-size="12" font-weight="600">Zero-Secret Pre-Signed Upload Pipeline</text>
  <text x="540" y="562" fill="#e2e8f0" font-size="10.5">1. App requests upload ticket → HTTPS POST to API Gateway / Lambda Endpoint</text>
  <text x="540" y="580" fill="#e2e8f0" font-size="10.5">2. Lambda signs 15-minute temporary PUT URL (No AWS keys in APK)</text>
  <text x="540" y="598" fill="#e2e8f0" font-size="10.5">3. Direct binary PUT upload → Private Research S3 Bucket (SSE-S3 encrypted)</text>
  <text x="540" y="614" fill="#94a3b8" font-size="9.5">4. Safe deletion of local files only after successful HTTP 200 &amp; ETag verification</text>

  <!-- INTER-SECTION CONNECTING ARROWS -->
  <!-- Layer 1 to Layer 2 -->
  <path d="M 310 153 L 340 153" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Layer 2 to Layer 3 -->
  <path d="M 650 153 L 680 153" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Layer 3 to Layer 4 -->
  <path d="M 820 345 L 820 360 L 260 360 L 260 375" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <!-- Layer 4 to Layer 5 -->
  <path d="M 480 500 L 510 500" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrowGreen)"/>

</svg>